name: Test Chatwork Notification

on:
  workflow_dispatch:

jobs:
  test-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
        run: |
          curl -X POST \
            -H "X-ChatWorkToken: $CHATWORK_TOKEN" \
            -d "body=%E3%80%90%E3%83%86%E3%82%B9%E3%83%88%E3%80%91EC%E6%A5%AD%E7%95%8C%E3%83%80%E3%83%83%E3%82%B7%E3%83%A5%E3%83%9C%E3%83%BC%E3%83%89%E3%81%AEChatwork%E9%80%9A%E7%9F%A5%E3%83%86%E3%82%B9%E3%83%88%E3%81%A7%E3%81%99%E3%80%82%0A%E6%AD%A3%E5%B8%B8%E3%81%AB%E9%80%81%E4%BF%A1%E3%81%A7%E3%81%8D%E3%81%A6%E3%81%84%E3%82%8C%E3%81%B0%E6%AF%8E%E6%9C%9D8%3A00%20JST%E3%81%AB%E8%87%AA%E5%8B%95%E9%80%9A%E7%9F%A5%E3%81%8C%E5%B1%8A%E3%81%8D%E3%81%BE%E3%81%99%E3%80%82%0APowered%20by%20%E3%82%B5%E3%82%A4%E3%83%90%E3%83%BC%E3%83%AC%E3%82%B3%E3%83%BC%E3%83%89%20EC%E4%BA%8B%E6%A5%AD%E9%83%A8" \
            "https://api.chatwork.com/v2/rooms/348526179/messages"
