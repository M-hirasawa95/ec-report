name: Test Chatwork Notification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-chatwork.yml'

jobs:
  test-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test to CHATWORK_ROOM_ID secret
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
          CHATWORK_ROOM_ID: ${{ secrets.CHATWORK_ROOM_ID }}
        run: |
          curl -X POST \
            -H "X-ChatWorkToken: $CHATWORK_TOKEN" \
            -d "body=%F0%9F%94%8D%E3%80%90%E9%80%81%E4%BF%A1%E5%85%88%E7%A2%BA%E8%AA%8D%E3%83%86%E3%82%B9%E3%83%88%E3%80%91%0A%E6%9C%AC%E7%95%AA%E3%81%AEChatwork%E9%80%9A%E7%9F%A5%E3%81%AF%E3%81%93%E3%81%AE%E3%83%81%E3%83%A3%E3%83%83%E3%83%88%E3%81%AB%E5%B1%8A%E3%81%8D%E3%81%BE%E3%81%99%E3%80%82%0A%E6%AF%8E%E6%9C%9D8%3A00%20JST%E3%81%AB%E8%87%AA%E5%8B%95%E9%80%9A%E7%9F%A5%E3%81%8C%E9%80%81%E3%82%89%E3%82%8C%E3%82%8B%E4%BA%88%E5%AE%9A%E3%81%A7%E3%81%99%E3%80%82" \
            "https://api.chatwork.com/v2/rooms/${CHATWORK_ROOM_ID}/messages"
