name: Test Chatwork Notification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-chatwork.yml'

jobs:
  test-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          CHATWORK_TOKEN: ${{ secrets.CHATWORK_TOKEN }}
